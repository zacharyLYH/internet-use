name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: make test

  alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          ./scripts/dev-up.sh > /tmp/dev-up.log 2>&1 &
          curl --fail --retry 60 --retry-delay 2 --retry-connrefused http://localhost:8000/health
