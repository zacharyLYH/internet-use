[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internet-use"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn[standard]",
    "beautifulsoup4",
    "trafilatura",
    "patchright",
    "yt-dlp",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["mypy", "openai", "pytest"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
